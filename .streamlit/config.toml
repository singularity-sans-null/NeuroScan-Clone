# Shared theme settings. With both [theme.light] and [theme.dark] defined,
# Streamlit follows the viewer's system preference by default and offers a
# System / Light / Dark switch in the top-right (three-dot) menu.
[theme]
primaryColor = "#3B82F6"
baseRadius = "small"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#EEF0F4"
textColor = "#111827"
borderColor = "#D9DDE3"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#0F1115"
secondaryBackgroundColor = "#1C212A"
textColor = "#E5E7EB"
borderColor = "#262C36"

[theme.dark.sidebar]
backgroundColor = "#12151B"

[client]
# "viewer" keeps the menu (with the theme switch) but hides developer options.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
